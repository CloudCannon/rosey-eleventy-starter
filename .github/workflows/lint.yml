name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          # Matches build.node_version in .cloudcannon/initial-site-settings.json
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
